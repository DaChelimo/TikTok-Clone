plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'androidx.navigation.safeargs.kotlin'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.0'
    id 'dagger.hilt.android.plugin'
}


android {
    // AGP 8 requires namespace here instead of the manifest's package attribute.
    namespace "com.andre_max.tiktokclone"

    // Compose 1.7.0 requires compiling against API 34; raised from 31 on 2026-07-25.
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.andre_max.tiktokclone"
        // Compose requires minSdk 21; raised from 17 on 2026-07-25 when the Compose
        // migration made the old value unbuildable.
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "0.1.0"

        vectorDrawables.useSupportLibrary = true

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Set the properties within `gradle.properties` into a `Properties` class so that values
        // within `gradle.properties` (e.g. Facebook API key) are accessible in this file.
        Properties properties = new Properties()
        if (rootProject.file("gradle.properties").exists()) {
            properties.load(rootProject.file("gradle.properties").newDataInputStream())
        }

        // Inject the Facebook API key and login protocol scheme into the manifest
        manifestPlaceholders = [
                "facebook_app_id": properties.getProperty("facebook_app_id", ""),
                "fb_login_protocol_scheme": properties.getProperty("fb_login_protocol_scheme", "")
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildTypes.forEach {
        // Facebook
        it.buildConfigField 'String', 'FACEBOOK_APP_ID', facebook_app_id

        // Google
        it.buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', GOOGLE_WEB_CLIENT_ID
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
        // Note: -Xallow-result-return-type was removed in Kotlin 2.0 (returning kotlin.Result is allowed by default).
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Video Compressor
//    implementation 'com.github.AbedElazizShe:LightCompressor:0.7.3'
//    implementation 'com.iceteck.silicompressorr:silicompressor:2.2.4'
//    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    implementation 'com.github.Andre-max:VideoCompressor:0.1.0-alpha'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:30.0.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'
//    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'

    // Auth libraries
    // Twitter auth was removed entirely (2026-07-25): Twitter Kit SDK is EOL and jcenter is dead.
    // To restore it, use Firebase Auth's OAuthProvider ("twitter.com") — no Twitter SDK needed.
    // See docs/plans/ONBOARDING_MIGRATION.md.
    implementation 'com.facebook.android:facebook-android-sdk:13.1.0'
    implementation 'com.google.android.gms:play-services-auth:20.1.0'

    // Country picker
    implementation 'com.hbb20:ccp:2.6.0'

    // ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer:2.17.1'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Groupie (com.xwray artifacts were jcenter-only; jitpack mirror keeps the same com.xwray.groupie package)
    implementation 'com.github.lisawray.groupie:groupie:2.10.1'
    implementation 'com.github.lisawray.groupie:groupie-viewbinding:2.10.1'

    // Edit CodeView
    // editcodeview 1.0.6 removed: jcenter-only artifact, no longer resolvable.
    // Source still references it (EnterCodeFragment.kt, EnterCodeViewModel.kt, fragment_enter_code.xml) — fix/replace manually.
//    implementation 'com.bigbangbutton:editcodeview:1.0.6'

    // Dexter
    implementation 'com.karumi:dexter:6.2.3'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
//    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    kapt 'com.github.bumptech.glide:compiler:4.13.0'

    // CameraView
    implementation 'com.otaliastudios:cameraview:2.7.2'

    // Sdp
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'

    // androidx.test 1.4 / espresso 3.4 call android.hardware.input.InputManager.getInstance(),
    // removed in newer platforms — on a current emulator every instrumented test dies in
    // Espresso.onIdle() with NoSuchMethodException before a single assertion runs. These versions
    // are the first that use the supported API. Only the androidTest configs are bumped; the JVM
    // suites stay on 1.4.0/1.1.3 for Robolectric 4.7.3.
    def espresso_version = '3.7.0'
    def androidx_test_junit_version = '1.3.0'
    def androidx_test_core_version = '1.7.0'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.mockito.kotlin:mockito-kotlin:4.0.0"
    testImplementation "com.google.truth:truth:1.1.3"
    androidTestImplementation "androidx.test.ext:junit:$androidx_test_junit_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
    // Truth is used by the Compose screen tests in androidTest, not just the JVM suites.
    androidTestImplementation "com.google.truth:truth:1.1.3"

    // SwipeToRefresh
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-common-java8:2.4.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2"

    // Compose
    def compose_ui_version = '1.7.0'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.material:material:$compose_ui_version"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.compose.foundation:foundation:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"

    // Lifecycle-aware Compose state collection (mandated by presentation/AGENTS.md)
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.2"

    // Hilt + Compose navigation (hiltViewModel() inside a Route composable)
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // Immutable collections for UiState (mandated by presentation/AGENTS.md)
    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7"

    // Turbine (StateFlow/Flow assertions) and MockK (Firebase boundary mocking)
    testImplementation "app.cash.turbine:turbine:1.1.0"
    testImplementation "io.mockk:mockk:1.13.11"

    // Dependencies for local unit tests
    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.arch.core:core-testing:2.1.0"
    testImplementation "org.robolectric:robolectric:4.7.3"
    testImplementation "androidx.test:core-ktx:1.4.0"
    testImplementation "androidx.test.ext:junit:1.1.3"
    testImplementation "com.google.truth:truth:1.1.3"

    // Instrumented testing
    // These two are `implementation`, so they ship inside the app APK. Left at 1.4.0/3.4.0 they
    // baked an old androidx.test.internal.platform.reflect.ReflectiveMethod into base.apk, which
    // the newer Espresso in the test APK then failed to call (NoSuchMethodError in onIdle). Keep
    // them in lockstep with the androidTest versions above.
    implementation "androidx.test:core:$androidx_test_core_version"
    implementation "androidx.test.espresso:espresso-idling-resource:$espresso_version"
    debugImplementation "androidx.fragment:fragment-testing:1.4.1"
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:$androidx_test_junit_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
    // espresso-contrib -> accessibility-test-framework:3.1 drags in the *fat*
    // org.checkerframework:checker:3.1.1, which repackages every class that
    // org.checkerframework:checker-qual (pulled in by guava/truth) already provides. Left alone,
    // :app:checkDebugAndroidTestDuplicateClasses fails and no instrumented test can run at all.
    // checker-qual is the annotations-only artifact everything else expects, so drop the fat one.
    androidTestImplementation("androidx.test.espresso:espresso-contrib:$espresso_version") {
        exclude group: 'org.checkerframework', module: 'checker'
    }
    androidTestImplementation "androidx.arch.core:core-testing:2.1.0"

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'

    // For instrumentation tests
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.51.1'
    kaptAndroidTest 'com.google.dagger:hilt-compiler:2.51.1'

    // For local unit tests
    testImplementation 'com.google.dagger:hilt-android-testing:2.51.1'
    kaptTest 'com.google.dagger:hilt-compiler:2.51.1'
}